<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Service Request - CSRMS</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- Top Navigation Header -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo-section">
                <h2>CSRMS Campus Portal</h2>
            </div>
            <div class="user-nav">
                <div class="user-info">
                    <span class="user-name" id="nav-user-name">Loading...</span>
                    <span class="user-role-badge" id="nav-user-role">Role</span>
                </div>
                <button class="btn btn-secondary" id="btn-logout" style="padding: 0.4rem 1rem; font-size: 0.85rem;">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Form Container -->
    <main class="app-container" style="max-width: 720px;">
        <div style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
            <h1 style="font-size: 1.75rem; font-weight: 700;">Submit Service Request</h1>
            <a href="/dashboard" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem 1rem;">Back to Dashboard</a>
        </div>

        <div class="details-card">
            <div id="alert-msg" class="alert" style="display: none;"></div>

            <form id="create-request-form">
                <div class="form-group">
                    <label for="title">Short Title / Subject</label>
                    <input type="text" id="title" class="form-control" placeholder="e.g. Broken faucet in Room 402" required minlength="5" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="category_id">Problem Category</label>
                    <select id="category_id" class="form-control" required>
                        <option value="">Loading categories...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location (Building, Room, Floor)</label>
                    <input type="text" id="location" class="form-control" placeholder="e.g. Science Block, Room 102" required minlength="2" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="priority">Initial Priority Estimate</label>
                    <select id="priority" class="form-control" required>
                        <option value="LOW">LOW - Non-blocking issue</option>
                        <option value="MEDIUM" selected>MEDIUM - Regular maintenance needed</option>
                        <option value="HIGH">HIGH - Urgent repair required</option>
                        <option value="URGENT">URGENT - Building safety/hazard issue</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Detailed Description of Problem</label>
                    <textarea id="description" class="form-control" rows="6" placeholder="Provide as much context as possible so maintenance staff can prepare tools..." required minlength="10" maxlength="2000"></textarea>
                </div>

                <div class="form-actions" style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">Submit Ticket</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Global Footer -->
    <footer>
        <p>Campus Service Request Management System (CSRMS) © 2026. Advanced Software Engineering Project.</p>
    </footer>

    <!-- Script Dependencies -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/request.js"></script>
</body>
</html>
